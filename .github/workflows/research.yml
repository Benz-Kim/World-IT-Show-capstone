name: Research integrity
on:
  push:
    paths: ['**.md', '**.csv', 'tools/**', '.github/workflows/research.yml']
  pull_request:
    paths: ['**.md', '**.csv', 'tools/**', '.github/workflows/research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_research.py
